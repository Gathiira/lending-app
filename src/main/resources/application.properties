spring.application.name=lms

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

server.servlet.context-path=/api

# Scheduler settings
scheduler.sweep.cron=0 0 1 * * *
scheduler.reminder.cron=0 0 8 * * *

# Logging
logging.level.com.lending=DEBUG
logging.level.org.springframework.scheduling=INFO

# JPA / Hibernate global settings
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_MS:604800000}
spring.security.user.name=disabled
spring.security.user.password=disabled