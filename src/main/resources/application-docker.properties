# Server
server.port=8085

# Datasource
spring.datasource.url=jdbc:postgresql://postgres:5432/lmsdb
spring.datasource.username=local
spring.datasource.password=localhost
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@lending.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Notification settings
notification.email.enabled=${EMAIL_ENABLED:false}
notification.email.from=${EMAIL_FROM:noreply@lending.com}
notification.sms.enabled=${SMS_ENABLED:false}
notification.mock.enabled=${MOCK_NOTIFICATIONS:true}
management.health.mail.enabled=false